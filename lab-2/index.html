
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagwood | Food Menu</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
<nav class="navbar navbar-expand-md dagwood-navbar">
    <div class="container">

        <!-- Logo / Brand -->
        <a class="navbar-brand" href="index.html">
            DAGWOOD<span>.</span>
        </a>

        <!-- Hamburger button for mobile -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation links -->
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#menu">Our Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#deals">Deals</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>
            </ul>

            <!-- Cart on the right -->
            <a class="cart-link" href="#cart">
                🛒 Cart
            </a>
        </div>

    </div>
</nav>

<!-- Bootstrap JavaScript: makes the hamburger button work -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!---Product Grid-->
<main class="container my-5" id="menu">

    <div class="text-center mb-4">
        <h1 class="menu-title">OUR MENU</h1>
        <p class="menu-subtitle">Fresh flavours. Big bites.</p>
    </div>

    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="product-card">
                <img src="Cocktail.jpg"
                     alt="Cocktail Sandwich">
                <div class="product-info">
                    <h5>COCKTAIL [WITH FRIES]</h5>
                    <p>Rs. 650</p>
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="product-card">
                <img src="Fillet Steak.jpg"
                     alt="Cheese Sandwich">
                <div class="product-info">
                    <h5>FILLET STEAK [WITH FRIES]</h5>
                    <p>Rs. 550</p>
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="product-card">
                <img src="CHEESE LOVER"
                     alt="Cheese Sandwich">
                <div class="product-info">
                    <h5>COCKTAIL [WITH FRIES]</h5>
                    <p>Rs. 450</p>
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="product-card">
                <img src="https://placehold.co/400x300?text=French+Fries"
                     alt="French Fries">
                <div class="product-info">
                    <h5>French Fries</h5>
                    <p>Rs. 300</p>
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>


</body>
</html>
